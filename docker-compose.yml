version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fintrackdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fintrack-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - fintrack-network

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fintrackdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: fintrack-super-secret-jwt-key-2026-minimum-32-chars-long
    depends_on:
      - postgres
      - redis
    networks:
      - fintrack-network

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend
    networks:
      - fintrack-network

networks:
  fintrack-network:
    driver: bridge

volumes:
  postgres_data:
